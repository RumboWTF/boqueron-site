<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boquerón — Spanish vocabulary app for non-native speakers in Spain</title>
  <meta name="description" content="A Spanish vocabulary app for non-native speakers living in Spain. Capture words you actually hear, review with spaced repetition, learn the language as you live it. Includes daily Andalusian expressions.">
  <meta name="keywords" content="Spanish vocabulary, flashcard, expat Spain, Andalusia, Málaga, learn Spanish, language app, immersion, SRS, Castilian, daily expressions, vocabulary review">
  <meta property="og:title" content="Boquerón">
  <meta property="og:description" content="A Spanish vocabulary app for non-native speakers living in Spain. Capture, review, remember.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://boqueron.app">
  <meta property="og:image" content="https://boqueron.app/boqueron-og-1200x630.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Boquerón — aprende español, palabra a palabra">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://boqueron.app/boqueron-og-1200x630.png">
  <meta name="twitter:title" content="Boquerón">
  <meta name="twitter:description" content="A Spanish vocabulary app for non-native speakers living in Spain. Capture, review, remember.">
  <link rel="icon" type="image/png" href="/fish-email-code.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <img src="/fish-email-code.png" alt="Boquerón fish" class="fish">
    <h1>Boquerón</h1>
    <p class="tagline">aprende español, palabra a palabra</p>
    <p class="muted">con sabor andaluz</p>

    <section class="expression" id="expression" hidden>
      <p class="label">expresión del día</p>
      <p class="expression-text" id="expression-text"></p>
      <p class="explanation" id="explanation-text"></p>
    </section>

    <p class="guide-link"><a href="/guia/">Cómo usar Boquerón →</a></p>

    <section class="download">
      <a href="https://apps.apple.com/app/id6763041600" class="badge-link" aria-label="Descargar Boquerón en el App Store">
        <img src="/app-store-badge-es.svg" alt="Descárgalo en el App Store" class="appstore-badge" />
      </a>
      <div class="qr-wrap">
        <img src="/boqueron-qr.svg" alt="Código QR para descargar Boquerón" class="qr" />
        <p class="qr-caption">Escanea para descargar</p>
      </div>
    </section>
    <p class="footer-link"><a href="/privacy/">privacidad</a></p>
  </main>

  <script>
    (async () => {
      const SUPABASE_URL = 'https://yjjgmrgwpppppkocquoz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlqamdtcmd3cHBwcHBrb2NxdW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTkwNzksImV4cCI6MjA5MTQ5NTA3OX0.KhnSEjPFLfaTrQCOxgcjH2sTC18MWglGi3qBCbXJN6c';

      try {
        const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Madrid' });
        const epoch = new Date(2025, 0, 1);
        const todayDate = new Date(`${today}T00:00:00`);
        const rawDayIndex = Math.floor((todayDate.getTime() - epoch.getTime()) / 86400000);
        const dayIndex = Math.max(0, rawDayIndex);
        const url = `${SUPABASE_URL}/rest/v1/daily_expressions?select=expression,explanation&active=eq.true&order=sort_order.asc`;
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) return;

        const pick = data[dayIndex % data.length];
        if (!pick) return;
        const { expression, explanation } = pick;
        document.getElementById('expression-text').textContent = expression;
        document.getElementById('explanation-text').textContent = explanation;
        document.getElementById('expression').hidden = false;
      } catch (e) {
        // Silent fail — page still shows the static content.
      }
    })();
  </script>
</body>
</html>
